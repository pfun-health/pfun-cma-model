worker_processes auto ;

events {
    worker_connections 1024 ;
}

# HTTP Server Configuration
# reference: https://github.com/hhftechnology/tailscaled-nginx/blob/51d6cf734421e0827d36e0adb113c72a1faaa332/nginx_conf/nginx-template.conf
http {
    # MIME Type Configuration
    # - Load standard MIME types
    # - Set default type for unlisted formats
    include /etc/nginx/mime.types ;
    default_type application/octet-stream ;

    # Logging Configuration
    # - Standard logging format with client details
    # - Captures request info, status, and headers
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log File Locations
    access_log /var/log/nginx/access.log main ;

    # Performance Optimizations
    # - Enable efficient file transfer
    # - Optimize TCP settings
    # - Configure connection timeouts
    sendfile on ;
    tcp_nopush on ;
    tcp_nodelay on ;
    keepalive_timeout 65 ;
    types_hash_max_size 2048 ;

    # Load Security Headers
    include /etc/nginx/conf.d/security-headers.conf;

    # HTTP Server Block (80)
    # Handles HTTP traffic, automatically redirects to HTTPS
    server {
        listen 80 ;
        server_name $TS_HOST_FQDN ;

        # Global Redirect to HTTPS
        # - Enforces secure connections
        # - Preserves original URI
        location / {
            return 301 https://$host$request_uri ;
        }
    }

    #-------------------------------------------------------------------------
    # HTTPS Server Block (Port 443)
    # - Handles all secure traffic
    # - Uses Tailscale-provided certificates
    #-------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name $TS_HOST_FQDN;

        # SSL Certificate Configuration
        # - Uses certificates from Tailscale
        # - Paths use environment variables
        # Caching SSL certs and keys with variables
        # ref: https://blog.nginx.org/blog/optimizing-resource-usage-for-complex-ssl-configurations
        ssl_certificate /certs/$TS_HOST_FQDN.crt;
        ssl_certificate_key /certs/$TS_HOST_FQDN.key;

        # Additional SSL Parameters
        include /etc/nginx/conf.d/ssl-params.conf;

        location /tailscale/auth {
            # tailscale nginx authentication
            # ref: https://tailscale.com/blog/tailscale-auth-nginx
            internal;

            proxy_pass http://unix:/run/tailscale.nginx-auth.sock;
            proxy_pass_request_body off ;

            proxy_set_header Host $http_host ;
            proxy_set_header Remote-Addr $remote_addr ;
            proxy_set_header Remote-Port $remote_port ;
            proxy_set_header Original-URI $request_uri ;
            # # uncomment below to restrict access to a specific tailnet
            ###proxy_set_header Expected-Tailnet "tailnet012345.ts.net";
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, no-transform";
            
            # Require tailscale nginx auth (Protect this route with tailscale authentication)
            # NOTE: these must be specified before proxy_pass
            auth_request /tailscale/auth ;
            auth_request_set $auth_user $upstream_http_tailscale_user ;
            auth_request_set $auth_name $upstream_http_tailscale_name ;
            auth_request_set $auth_login $upstream_http_tailscale_login ;
            auth_request_set $auth_tailnet $upstream_http_tailscale_tailnet ;
            auth_request_set $auth_profile_picture $upstream_http_tailscale_profile_picture ;

            proxy_set_header X-Webauth-User "$auth_user";
            proxy_set_header X-Webauth-Name "$auth_name";
            proxy_set_header X-Webauth-Login "$auth_login";
            proxy_set_header X-Webauth-Tailnet "$auth_tailnet";
            proxy_set_header X-Webauth-Profile-Picture "$auth_profile_picture";

            proxy_pass http://$remote_addr:8001 ;
            proxy_set_header Host $host ;
            proxy_set_header X-Real-IP $remote_addr ;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
            proxy_set_header X-Forwarded-Proto $scheme ;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' 'localhost, robcapps.com, cloud.tail38611b.ts.net, pfun.one, pfun.me, pfun.run, pfun.app';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';

            # Additional settings
            proxy_read_timeout 90 ;
            proxy_connect_timeout 90 ;
            proxy_redirect off ;

            # Disable buffering for streaming responses
            proxy_buffering off ;
            proxy_request_buffering off ;
        }

        # Error Handling
        # - Custom error pages for server errors
        # - Serves from standard nginx directory
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

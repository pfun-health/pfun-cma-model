[project]
site_name = "PFun CMA Model"
site_description = "Documentation for the pfun-cma-model — a physiological chronometabolic model for glucose, hormone, and circadian rhythm analysis."
site_author = "Robbie Capps"
site_url = "https://pfun-health.github.io/pfun-cma-model"
copyright = """
Copyright © 2026 PFun Health
"""

docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ]},
  { "CMA Model" = [
    { "Overview" = "model/overview.md" },
    { "Parameters" = "model/parameters.md" },
    { "Fitting" = "model/fitting.md" },
    { "Chronometabolic Analysis" = "pfun-glucose-chronometabolic-analysis.md" },
  ]},
  { "Demos & Examples" = [
    { "Gallery" = "demos/gallery.md" },
    { "LLM Scenario Generation" = "demos/llm-scenarios.md" },
    { "WebSocket Streaming" = "demos/websocket-streaming.md" },
    { "Qt GUI" = "demos/qt-gui.md" },
    { "Notebooks" = "demos/notebooks.md" },
  ]},
  { "CLI Reference" = "cli.md" },
  { "API Reference" = "api.md" },
  { "Deployment" = "deployment.md" },
  { "Security" = "security.md" },
  { "Contributing" = "contributing.md" },
]

language = "en"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme.palette]
scheme = "slate"
primary = "indigo"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
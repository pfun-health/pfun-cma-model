[project]
site_name = "PFun CMA Model"
site_description = "Documentation for the pfun-cma-model Python package, including usage, API reference, and deployment guidance."
site_author = "Robbie Capps"
site_url = "https://github.com/pfun-health/pfun-cma-model"
copyright = """
Copyright © 2026 PFun Health
"""

docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "API Reference" = "api.md" },
]

language = "en"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme]
variant = "classic"

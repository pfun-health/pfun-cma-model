services:

  # pfun-qt-gui:
  #   extends:
  #     file: packages/pfun_qt_gui/docker-compose.yml
  #     service: pfun-qt-gui
  #  # NOTE: we use 'extends' here to include the service definition from the package's

  pfun-cma-model:
    labels:
      - "compose2nix.settings.sops.secrets=.env"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-cma-model
    ports:
      - "8001:8001"
    networks:
      - pfun-cma-network
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_cma_model.app:app",
        "--proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "2"
      ]

  redis:
    env_file: .env
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - pfun-cma-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis-data:

# Define networks at the root level
networks:
  pfun-cma-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

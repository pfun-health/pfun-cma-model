# PFun CMA Model — Docker Compose
#
# Start with:
#   docker compose up -d
#
# Full rebuild:
#   docker compose up -d --build --renew-anon-volumes --remove-orphans
#
# Services:
#   api   — Hono TypeScript API (port 8000)
#   redis — Cache backend (port 6379)
#   ollama — LLM backend (commented out, requires model download)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfun-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pfun-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---- LLM Backend (optional) ----
  # Uncomment and run `docker compose up -d ollama` to enable local LLM inference.
  # Then set LLM_BACKEND=ollama in your .env file.
  # The first model pull may take several minutes:
  #   docker compose exec ollama ollama pull llama3.2
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles:
  #     - llm
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - pfun-network
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

networks:
  pfun-network:
    driver: bridge

volumes:
  redis-data:
  # ollama-data:

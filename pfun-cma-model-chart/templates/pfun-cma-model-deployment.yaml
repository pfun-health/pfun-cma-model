apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c -o pfun-cma-model-chart
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: pfun-cma-model
  name: pfun-cma-model
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pfun-cma-model
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c -o pfun-cma-model-chart
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: pfun-cma-model
    spec:
      containers:
        - args:
            - uv
            - run
            - uvicorn
            - pfun_cma_model.app:app
            - --proxy-headers
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --workers
            - "2"
          env:
            - name: GROUP
              value: nonroot
            - name: USER
              value: nonroot
            - name: UVICORN_RELOAD
              value: "false"
          envFrom:
            - configMapRef:
                name: env
          image: pfun-cma-model
          name: pfun-cma-model
          ports:
            - containerPort: 8001
              protocol: TCP
      restartPolicy: Always

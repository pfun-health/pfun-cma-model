baseURL = "https://blog.pfun.one/"
title = "PFun CMA Model"
theme = "hextra"
locale = "en"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "English"
    weight = 1
    title = "PFun CMA Model"

[params]
  description = "Documentation for the pfun-cma-model — a physiological chronometabolic model for glucose, hormone, and circadian rhythm analysis."
  images = ["logo.png"]

  [params.author]
    name = "Robbie Capps"
    email = "robbie@pfun.me"

  navbar.displayLogo = true
  navbar.displayTitle = true
  navbar.width = "wide"
  footer.displayCopyright = true
  footer.displayPoweredBy = true
  footer.since = 2026

  page.width = "wide"

  search.index = "all"

  editURL.enable = false

  theme.default = "system"
  theme.displayToggle = true

  highlight.copy = true
  highlight.lang = ["bash", "python", "toml", "yaml", "json", "text"]

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    pageRef = "/blog"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 3
    url = "https://github.com/pfun-health/pfun-cma-model"
    [menu.main.params]
      icon = "github"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      typographer = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"]]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "catppuccin-latte"

[module]
  [[module.mounts]]
    source = "docs/assets"
    target = "static/assets"
  [[module.mounts]]
    source = "docs/javascripts"
    target = "static/javascripts"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

[services]
  [services.googleAnalytics]
    ID = ""

[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[imaging]
  resampleFilter = "Box"
  quality = 85
  anchor = "smart"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  page = "/:slug/"
  section = "/:slug/"

[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

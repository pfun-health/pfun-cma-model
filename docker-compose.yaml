services:

  pfun-cma-model:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-cma-model
    ports:
      - "8001:8001"
    networks:
      - pfun-cma-network
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_cma_model.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "1"
      ]

  pfun-gradio:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./pfun_gradio/Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-gradio
    ports:
      - "7860:7860"
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_gradio.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "7860",
        "--workers",
        "1"
      ]
    networks:
      - pfun-cma-network

  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./opentelemetry-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "1080:1080"  # Expose NGINX on port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount the NGINX config
    depends_on:
      - pfun-cma-model
      - pfun-gradio
    networks:
      - pfun-cma-network  # Attach to the network
    
# Define networks at the root level
networks:
  pfun-cma-network:
    driver: bridge

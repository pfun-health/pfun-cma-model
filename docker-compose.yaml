services:

  pfun-cma-model:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-cma-model
    ports:
      - "8001:8001"
    networks:
      - pfun-cma-network
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_cma_model.app:app",
        "--proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "1"
      ]

  pfun-gradio:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./pfun_gradio/Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-gradio
    ports:
      - "7860:7860"
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_gradio.main:app",
        "--proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "7860",
        "--workers",
        "1"
      ]
    networks:
      - pfun-cma-network

  #-----------------------------------------------------------------------------
  # Tailscale Sidecar Service
  # - Manages Tailscale network connectivity
  # - Handles certificate generation and distribution
  #-----------------------------------------------------------------------------
  ts-nginx:
    image: hhftechnology/tailscale-sidecar:latest
    container_name: ts-$TS_HOSTNAME
    restart: unless-stopped
    hostname: $TS_HOSTNAME
    environment:
      - TS_AUTHKEY=$TS_AUTHKEY          # Authentication key for Tailscale
      - TS_STATE_DIR=/var/lib/tailscale # Directory for Tailscale state
      - TS_DOMAIN_NAME=$TS_HOST_FQDN    # Domain for certificate generation
    volumes:
      - ts-nginx-state:/var/lib/tailscale # Persists Tailscale network state
      - ts-nginx-certs:/certs             # Shares certificates between services
      - /dev/net/tun:/dev/net/tun         # Required for VPN functionality
    cap_add:
      - net_admin   # Required for network administration
      - sys_module  # Required for kernel module management
  
  nginx:
    image: nginx:latest
    container_name: ts-$TS_HOSTNAME-nginx
    restart: unless-stopped
    network_mode: service:ts-nginx  # uses tailscale network namespace
    ports:
      - "8080:8080"  # Expose NGINX on port
    volumes:
      - ts-nginx-certs:/certs          # Mounts Tailscale certificates
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount the NGINX config
      - ./nginx/html/index.html:/etc/nginx/html/index.html:ro  # Mount the NGINX index page
    environment:
      - TS_HOST_FQDN=${TS_HOST_FQDN}  # Domain name for nginx configuration
    depends_on:
      - ts-nginx  # ensure tailscale starts first
      - pfun-cma-model
      - pfun-gradio
    networks:
      - pfun-cma-network  # Attach to the network
    entrypoint: [
      "sh", "-c",
      # Substitutes environment variables and starts NGINX
      "envsubst < /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    ]
    
# Define networks at the root level
networks:
  pfun-cma-network:
    driver: bridge

#-----------------------------------------------------------------------------
# Persistent Storage
# - ts-nginx-state: Maintains Tailscale network configuration
# - ts-nginx-certs: Stores SSL/TLS certificates
#-----------------------------------------------------------------------------
volumes:
  ts-nginx-state:
  ts-nginx-certs:
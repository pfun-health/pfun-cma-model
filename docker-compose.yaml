services:

  pfun-cma-model:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "nonroot:nonroot"
    env_file: .env
    environment:
      - UVICORN_RELOAD=false
      - USER=nonroot
      - GROUP=nonroot
    container_name: pfun-cma-model
    ports:
      - "8001:8001"
    networks:
      - pfun-cma-network
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pfun_cma_model.app:app",
        "--proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "1"
      ]

# Define networks at the root level
networks:
  pfun-cma-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
name: Build Nix Images

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve image metadata
        id: meta
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          try:
              owner = os.environ["GITHUB_REPOSITORY_OWNER"]
              output_path = os.environ["GITHUB_OUTPUT"]
          except KeyError as exc:
              raise SystemExit(f"Missing required GitHub Actions environment variable: {exc.args[0]}") from exc

          try:
              data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
              project = data["project"]
              image_name = project["name"]
              version = project["version"]
          except FileNotFoundError as exc:
              raise SystemExit("pyproject.toml is required to resolve image metadata.") from exc
          except tomllib.TOMLDecodeError as exc:
              raise SystemExit(f"pyproject.toml is not valid TOML: {exc}") from exc
          except KeyError as exc:
              raise SystemExit(f"Missing required project metadata key in pyproject.toml: {exc.args[0]}") from exc

          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write(f"image_name={image_name}\n")
              fh.write(f"version={version}\n")
              fh.write(f"image_base=ghcr.io/{owner}/{image_name}\n")
          PY

      - name: Build OCI image
        run: nix build .#oci-image

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image
        run: |
          docker load < result
          docker tag \
            "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.version }}"
          docker tag \
            "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image_base }}:latest"
          docker push "${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image_base }}:latest"

      - name: Build VM image
        run: nix build .#vm-image

      - name: Stage VM image artifact
        id: vm
        run: |
          # nixos-generators qcow outputs may use either .qcow or .qcow2, so
          # pick the first path in deterministic lexical order if both exist.
          VM_SOURCE="$(find -L result -type f -name '*.qcow*' | LC_ALL=C sort | head -n 1)"
          if [ -z "${VM_SOURCE}" ]; then
            echo "Unable to find a VM image artifact in ./result" >&2
            exit 1
          fi
          VM_TARGET="pfun-cma-model-${{ steps.meta.outputs.version }}.qcow2"
          cp "${VM_SOURCE}" "${VM_TARGET}"
          echo "artifact=${VM_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Upload VM image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfun-cma-model-vm-image
          path: ${{ steps.vm.outputs.artifact }}

      - name: Attach VM image to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.vm.outputs.artifact }}

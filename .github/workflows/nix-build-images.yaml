name: Build Nix Images

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve image metadata
        id: meta
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');

          try {
              const owner = process.env.GITHUB_REPOSITORY_OWNER;
              const outputPath = process.env.GITHUB_OUTPUT;
              
              if (!owner || !outputPath) {
                  console.error("Missing required GitHub Actions environment variables.");
                  process.exit(1);
              }

              const data = fs.readFileSync(path.resolve('package.json'), 'utf8');
              const pkg = JSON.parse(data);
              
              if (!pkg.name || !pkg.version) {
                  console.error("Missing required keys ('name' or 'version') in package.json.");
                  process.exit(1);
              }

              // Strip npm scope if present (e.g., "@myorg/my-vite-app" -> "my-vite-app")
              const imageName = pkg.name.split('/').pop();
              const version = pkg.version;

              fs.appendFileSync(outputPath, `image_name=${imageName}\n`);
              fs.appendFileSync(outputPath, `version=${version}\n`);
              fs.appendFileSync(outputPath, `image_base=ghcr.io/${owner}/${imageName}\n`);
          } catch (err) {
              if (err.code === 'ENOENT') {
                  console.error("package.json is required to resolve image metadata.");
              } else if (err instanceof SyntaxError) {
                  console.error(`package.json is not valid JSON: ${err.message}`);
              } else {
                  console.error(`Error resolving metadata: ${err.message}`);
              }
              process.exit(1);
          }
          JS

      - name: Build OCI image
        run: nix build .#oci-image

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image
        run: |
          docker load < result
          docker tag \
            "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.version }}"
          docker tag \
            "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image_base }}:latest"
          docker push "${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image_base }}:latest"

      - name: Build VM image
        run: nix build .#vm-image

      - name: Stage VM image artifact
        id: vm
        run: |
          VM_SOURCE="$(
            find -L result -type f \( -name '*.qcow' -o -name '*.qcow2' \) |
            LC_ALL=C sort |
            head -n 1
          )"
          if [ -z "${VM_SOURCE}" ]; then
            echo "Unable to find a VM image artifact in ./result" >&2
            exit 1
          fi
          # Using dynamic image name instead of hardcoded prefix
          VM_TARGET="${{ steps.meta.outputs.image_name }}-${{ steps.meta.outputs.version }}.qcow2"
          cp "${VM_SOURCE}" "${VM_TARGET}"
          echo "artifact=${VM_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Upload VM image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.image_name }}-vm-image
          path: ${{ steps.vm.outputs.artifact }}

      - name: Attach VM image to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.vm.outputs.artifact }}

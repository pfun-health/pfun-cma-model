name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # needed to push version commit, create tags, and create GitHub Release

jobs:
  # ── 1. Run the test suite ─────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Tests
        run: |
          ./scripts/uv-full-sync.sh && \
          ./scripts/run-tests.sh

  # ── 2. Bump version, build, and publish a GitHub Release ─────────────────
  release:
    name: Create Release
    needs: test          # only runs if tests pass
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so that git operations (tagging, pushing) work
          fetch-depth: 0
          # Use a PAT (stored as GH_TOKEN secret) so the push triggers downstream
          # workflows.  Falls back to the default GITHUB_TOKEN if not set.
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group dev --link-mode copy

      # Configure git so the version-bump commit is attributed correctly
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bump the patch version in pyproject.toml (e.g. 0.4.208 → 0.4.209)
      - name: Bump patch version
        run: uv version --bump patch

      # Capture the new version string for use in later steps
      - name: Read new version
        id: version
        run: |
          VERSION=$(uv version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Build the wheel and sdist
      - name: Build package
        run: uv build --no-cache --wheel --sdist

      # Commit the bumped pyproject.toml and uv.lock back to main
      - name: Commit version bump
        run: |
          git add pyproject.toml uv.lock
          git commit -m "(${{ steps.version.outputs.value }}) bump to new version. [skip ci]"

      # Create a lightweight tag for the release (e.g. 0.4.209)
      - name: Create version tag
        run: git tag "${{ steps.version.outputs.value }}" || echo "skipping tag creation."

      # Push the version bump commit to main together with the tag
      - name: Push commit and tag
        run: |
          git push origin HEAD:main "${{ steps.version.outputs.value }}"

      # Published releases may be immutable, so do not try to update them on retries.
      - name: Check release status
        id: release_status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          IS_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.draft' 2>/dev/null || true)
          if [ "$IS_DRAFT" = "false" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Create a GitHub Release and upload the built wheels/sdist
      - name: Create GitHub Release
        if: steps.release_status.outputs.already_published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: "v${{ steps.version.outputs.value }}"
          body: |
            Automated release — patch version bump.

            ### Assets
            Built wheel and source distribution are attached below.
          files: dist/*
          draft: true
          prerelease: true

      # Publish only after all assets have been uploaded to the draft release.
      - name: Publish GitHub Release
        if: steps.release_status.outputs.already_published != 'true'
        run: gh release edit "${{ steps.version.outputs.value }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ── 1. Run the test suite ─────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run Tests
        run: pnpm test

  # ── 2. Bump version, build, and publish a GitHub Release ─────────────────
  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build all packages
        run: pnpm -r build

      - name: Bump version
        id: version
        run: |
          pnpm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add package.json packages/*/package.json
          git commit -m "(${{ steps.version.outputs.value }}) bump to new version. [skip ci]"

      - name: Create version tag
        run: git tag "${{ steps.version.outputs.value }}"

      - name: Push commit and tag
        run: |
          git push origin main
          git push origin "${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: "v${{ steps.version.outputs.value }}"
          body: |
            Automated release — patch version bump.

            ### Assets
            Built packages are available on the npm registry.
          draft: false
          prerelease: false

name: TypeScript Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a TypeScript release
        required: true
        default: false
        type: boolean
  push:
    branches: [typescript-rewrite]

permissions:
  contents: write

concurrency:
  group: typescript-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  package:
    name: Package TypeScript artifacts
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_file: ${{ steps.package.outputs.artifact_file }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve version
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build TypeScript release artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ARTIFACT_NAME="typescript-build-${VERSION}"
          ARTIFACT_FILE="${ARTIFACT_NAME}.tar.gz"
          mapfile -t DIST_DIRS < <(find packages -mindepth 2 -maxdepth 2 -type d -name dist | sort)
          if [ "${#DIST_DIRS[@]}" -eq 0 ]; then
            echo "No build output folders found under packages/*/dist" >&2
            exit 1
          fi
          tar -czf "${ARTIFACT_FILE}" "${DIST_DIRS[@]}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=${ARTIFACT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload TypeScript artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_file }}
          if-no-files-found: error

  release:
    name: Create TypeScript release
    needs: package
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/typescript-rewrite' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-ts]'))
      )
    steps:
      - name: Download TypeScript artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets

      - name: Create TypeScript GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: typescript-v${{ needs.package.outputs.version }}
          name: TypeScript v${{ needs.package.outputs.version }}
          target_commitish: typescript-rewrite
          files: release-assets/${{ needs.package.outputs.artifact_file }}
          generate_release_notes: true

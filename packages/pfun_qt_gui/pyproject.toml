[project]
name = "pfun-qt-gui"
version = "0.1.0"
description = "A PyQt6 frontend for the PFun CMA Model."
readme = "README.md"
authors = [
    { name = "Robbie Capps", email = "robbie@pfun.me" }
]
requires-python = "==3.12.11"
dependencies = [
    "PyQt6>=6.6.0",
    "dotenv>=0.9.9",
    "pfun-common",
    "pyside6>=6.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip>=26.0.1",
    "pyside6>=6.11.0",
]

[tool.pyside6-project]
files = ["src/pfun_qt_gui/main.py", ]
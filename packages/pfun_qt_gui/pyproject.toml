[project]
name = "pfun-qt-gui"
version = "0.1.0"
description = "A PyQt6 frontend for the PFun CMA Model."
readme = "README.md"
authors = [
    { name = "Robbie Capps", email = "robbie@pfun.me" }
]
requires-python = "==3.12.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pfun-common"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfun-qt-gui"
version = "0.1.0"
description = "A PyQt6 frontend for the PFun CMA Model."
readme = "README.md"
authors = [{ name = "Robbie Capps", email = "robbie@pfun.me" }]
requires-python = ">=3.11,<3.14"
dependencies = ["PyQt6>=6.6.0", "dotenv>=0.9.9", "pfun-common", "supervisor>=4.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip>=26.0.1",
    "pyside6>=6.11.0",
    "pytest>=9.0.3",
    "pfun-cma-model",
    "qtpip>=0.1.4",
]

[tool.pyside6-project]
files = ["src/pfun_qt_gui/main.py"]

[tool.uv.sources]
pfun-common = { path = "../pfun_common" }
pfun_llm = { path = "../../pfun_llm" }
pfun-cma-model = { path = "../../" }

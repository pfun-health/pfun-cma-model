[project]
name = "pfun-common"
version = "0.1.92"
description = "Common utilities and functions for PFun projects."
readme = "README.md"
authors = [
    { name = "Robbie Capps", email = "robbie@pfun.me" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = [
    "pfun_common",
    "pfun_common.utils",
    "pfun_common.settings",
    "pfun_common.data",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
